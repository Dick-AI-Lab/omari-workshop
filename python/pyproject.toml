[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "omari_us"
version = "0.1.0"
description = "Reusable data, model, training, evaluation, explainability and export utilities for the OMARI 'From Pixels to Predictions' workshop."
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "timm>=0.9.12", "numpy>=1.24", "pandas>=2.0",
  "scikit-learn>=1.3", "scipy>=1.10", "pillow>=10", "matplotlib>=3.7", "pyyaml>=6", "tqdm>=4.66",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
cv = ["opencv-python-headless>=4.8"]

[tool.setuptools.packages.find]
include = ["omari_us*"]
